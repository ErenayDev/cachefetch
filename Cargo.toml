[package]
name = "cachefetch"
version = "0.1.0"
edition = "2024"

authors = ["ErenayDev <erenaydev@proton.me>"]
description = "Fast CLI tool that shows cache file sizes"
documentation = "https://github.com/ErenayDev/cachefetch#readme"
homepage = "https://github.com/ErenayDev/cachefetch"
repository = "https://github.com/ErenayDev/cachefetch"
license = "MIT"
keywords = ["cli", "cache", "disk", "size", "fetch"]
categories = ["command-line-utilities"]
readme = "README.md"

[dependencies]
byte-unit = "5.2.0"
crossterm = "0.29.0"
owo-colors = "4.3.0"
terminal_size = "0.4.4"
libc = "0.2.184"
jwalk = "0.8.1"
rayon = "1.11.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "main_bench"
harness = false

[lib]
name = "cachefetch"
path = "src/lib.rs"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-{ version }{ archive-suffix }"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/cachefetch", dest = "/usr/bin/cachefetch", mode = "755" },
]
summary = "Fast CLI tool that shows cache file sizes"
description = """
cachefetch is a very fast, configurable CLI fetch tool that shows your cache file sizes in your disk.
It supports multiple cache directories and provides clean table output.
"""
license = "MIT"

[package.metadata.deb]
maintainer = "ErenayDev <erenaydev@proton.me>"
copyright = "2025, ErenayDev <erenaydev@proton.me>"
extended-description = """
A fast and configurable command-line tool for displaying cache directory sizes.
cachefetch scans common cache locations and displays their sizes in a clean table format.
"""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/cachefetch", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/cachefetch/", "644"],
]
